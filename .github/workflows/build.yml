name: build

# macOS runner 构建，本地零安装。
# 产物：build/*.ipa —— M(minimal) / B(full) / T(theos staged)，各自独立 bundle id，
#       用于二分定位「安装成功但启动即退」的原因。

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos 与 iOS SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="/opt/homebrew/bin:$PATH"
          clang --version | head -1
          git --version
          brew install ldid || brew upgrade ldid || echo "ldid already present"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -d "$THEOS/sdks"/iPhoneOS*.sdk
          which ldid clang make

      - name: 静态自检
        run: python3 tools/audit.py
      - name: 注入链逻辑审查
        run: python3 tools/preflight.py

      - name: 构建
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="/opt/homebrew/bin:$PATH"
          make package

      - name: 构建越狱版插件 (tweak deb)
        run: |
          cd tweak
          make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1 | tail -40
          ls -la packages/ || true
          mkdir -p ../build
          cp packages/*.deb ../build/ 2>/dev/null || true
      - name: 校验产物
        run: |
          set -e
          echo "=== build dir ==="
          ls -la build
          for ipa in build/*.ipa; do
            echo
            echo "=== $ipa ==="
            unzip -l "$ipa"
            tmp=$(mktemp -d)
            unzip -q "$ipa" -d "$tmp"
            app=$(find "$tmp/Payload" -maxdepth 1 -name '*.app' -type d | head -1)
            test -n "$app" || { echo "FATAL: no .app inside $ipa"; exit 1; }
            test -f "$app/Info.plist" || { echo "FATAL: no Info.plist inside $ipa"; exit 1; }
            plutil -lint "$app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist"
            echo "--- arch ---"
            otool -hv "$app/ARHost" | awk 'NR==4{print $2,$3,$4,$5}'
            echo "--- files in bundle ---"
            ls -la "$app"
            rm -rf "$tmp"
          done

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: ARHost-release
          path: build/*.ipa
          if-no-files-found: error
